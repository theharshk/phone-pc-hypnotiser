<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phone Remote</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0D14" id="meta-theme-color">
    <link rel="stylesheet" href="style.css">
    <script>
        try {
            const theme = localStorage.getItem('app-theme') || 'system';
            const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (!isDark) {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('meta-theme-color').content = '#EEF1F6';
            }
        } catch(e) {}
    </script>
</head>
<body>
    <div id="app">
        <div id="auth-container" style="display:none; padding:24px;"></div>
        <div id="main-container" style="display:none; height:100%; display:flex; flex-direction:column;">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 24px;">
                <div style="display:flex; align-items:center; gap:8px;">
                    <div id="status-indicator" style="width:8px; height:8px; border-radius:50%; background:var(--muted);"></div>
                    <span id="status-text" style="font-size:0.9rem; color:var(--muted); font-family:var(--font-mono);">Connecting...</span>
                </div>
                <div style="display:flex; gap:8px;">
                    <button id="edit-btn" style="background:none; border:none; color:var(--accent-text); font-weight:600; font-size:1rem; padding:8px;">Edit</button>
                    <button id="settings-btn" style="background:none; border:none; color:var(--accent-text); padding:8px;">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </button>
                </div>
            </div>
            <div id="module-container" style="flex:1; overflow-y:auto; padding:0 16px 24px 16px; display:flex; flex-direction:column; gap:16px;"></div>
        </div>
        <div id="active-module" style="display:none; position:fixed; top:0; left:0; width:100%; height:100dvh; background:var(--ground); z-index:100; flex-direction:column;"></div>
    </div>
    <script type="module" src="host.js"></script>
</body>
</html>
