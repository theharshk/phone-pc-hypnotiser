<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05070B">
    <title>Phone Remote</title>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('pr_theme') || 'dark';
                var bedside = localStorage.getItem('pr_bedside') === 'true';
                var effective = theme;
                if (theme === 'system') {
                    effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
                }
                document.documentElement.setAttribute('data-theme', effective);
                if (bedside) {
                    document.documentElement.setAttribute('data-bedside', 'true');
                }
                var metaTheme = document.querySelector('meta[name="theme-color"]');
                if (metaTheme) {
                    metaTheme.setAttribute('content', effective === 'light' ? '#E8EBF0' : '#05070B');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-container">
        <header id="app-header" class="app-header">
            <div class="header-main">
                <div class="header-titles">
                    <h1 id="device-title" class="device-title">Remote</h1>
                    <div id="status-line" class="status-line">
                        <span id="status-dot" class="status-dot disconnected" aria-hidden="true"></span>
                        <span id="status-text" class="status-text">Disconnected</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="moon-btn" class="pill-btn-icon" aria-label="Toggle bedside mode" title="Bedside mode">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </button>
                    <button id="edit-btn" class="pill-btn-outline" aria-label="Edit modules">Edit</button>
                    <button id="settings-btn" class="pill-btn-outline" aria-label="Open settings">Settings</button>
                </div>
            </div>
        </header>

        <main id="main-content" class="main-content">
            <div id="home-view" class="view-panel"></div>
            <div id="settings-view" class="view-panel" style="display:none;"></div>
            <div id="active-module" class="view-panel" style="display:none;"></div>
        </main>
    </div>

    <script type="module" src="host.js"></script>
</body>
</html>
